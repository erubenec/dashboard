# Builds the NetBird dashboard from upstream main plus this fork's feature
# branches and publishes a multi-arch image (amd64, arm64 and arm) to ghcr.io.
#
# Nothing is written back to the repository. The runner merges upstream/main
# with the branches listed in features.txt in a throwaway branch (see
# scripts/compose.sh), so this default branch stays a tiny `fork-ci` branch.
# The build steps mirror upstream's build_and_push.yml. The dashboard is a
# static export, so one build serves every architecture and QEMU only has to
# run the cheap image steps.
name: fork build

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this exact upstream and features combination was already built
        type: boolean
        default: false
  push:
    branches: [fork-ci]

concurrency:
  group: fork-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: netbirdio/dashboard
  # Part of the build fingerprint: bump it to rebuild when the way images are
  # built changes without upstream or the features changing.
  BUILD_REV: platforms=linux/amd64,linux/arm64,linux/arm

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the fork with all branches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compose upstream main with the feature branches
        id: compose
        run: |
          cp scripts/compose.sh "$RUNNER_TEMP/compose.sh"
          bash "$RUNNER_TEMP/compose.sh"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when this exact combination is already published
        id: check
        env:
          PREFIX: ${{ steps.compose.outputs.prefix }}
          FP: ${{ steps.compose.outputs.fp }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && docker buildx imagetools inspect "$PREFIX/netbird-dashboard:src-$FP" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already built for this upstream and features combination; nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.build == 'true'
        run: npm install

      - name: Write an empty local config
        if: steps.check.outputs.build == 'true'
        run: echo '{}' > .local-config.json

      - name: Download IronRDP release TS files
        if: steps.check.outputs.build == 'true'
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: "*.ts"
          out-file-path: public/ironrdp-pkg

      - name: Download IronRDP release JS files
        if: steps.check.outputs.build == 'true'
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: "*.js"
          out-file-path: public/ironrdp-pkg

      - name: Download IronRDP release WASM file
        if: steps.check.outputs.build == 'true'
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: netbirdio/IronRDP
          tag: v0.0.2
          fileName: ironrdp_web_bg.wasm
          out-file-path: public/ironrdp-pkg

      - name: Build
        if: steps.check.outputs.build == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_DASHBOARD_VERSION: fork-${{ steps.compose.outputs.up7 }}

      - name: Set up QEMU
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push the dashboard image
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.compose.outputs.prefix }}/netbird-dashboard:latest
            ${{ steps.compose.outputs.prefix }}/netbird-dashboard:src-${{ steps.compose.outputs.fp }}
            ${{ steps.compose.outputs.prefix }}/netbird-dashboard:${{ steps.compose.outputs.date }}-up${{ steps.compose.outputs.up7 }}
